<!DOCTYPE html>
<html>

<head>

<title>Pingu Calendar</title>

<style>

body{
    margin:0;
    background:#DFF6FF;
    font-family:-apple-system,BlinkMacSystemFont,Arial;
}


.container{

    width:750px;

    margin:30px auto;

    display:flex;

    gap:15px;

}




.calendarBox{

    width:380px;

    background:white;

    border-radius:30px;

    padding:20px;

    box-shadow:0 8px 25px rgba(0,0,0,.12);

}




.memoBox{

    width:260px;

    background:#F8FCFF;

    border-radius:30px;

    padding:20px;

    box-shadow:0 8px 25px rgba(0,0,0,.12);

}




.pingu{

    width:100px;

    display:block;

    margin:auto;

    animation:pingu 2s infinite;

}



@keyframes pingu{

    50%{
        transform:translateY(-8px);
    }

}




.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:20px;

    font-weight:bold;

}




button{

    border:0;

    background:#A7C7E7;

    color:white;

    padding:8px 12px;

    border-radius:20px;

    cursor:pointer;

}




.week{

    display:grid;

    grid-template-columns:repeat(7,1fr);

    text-align:center;

    margin-top:15px;

    color:#999;

    font-size:13px;

}




.calendar{

    display:grid;

    grid-template-columns:repeat(7,1fr);

}




.day{

    height:38px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:50%;

    cursor:pointer;

    font-size:14px;

}




.day:hover{

    background:#E8F7FF;

}



.selected{

    background:#A7C7E7;

    color:white;

}



.today{

    border:2px solid #7EC8E3;

}




.memoTitle{

    font-size:22px;

    font-weight:bold;

}



input,select{

    width:100%;

    box-sizing:border-box;

    margin-top:10px;

    padding:10px;

    border-radius:15px;

    border:1px solid #ddd;

}




.save{

    margin-top:10px;

}



.memoItem{

    margin-top:10px;

    padding:12px;

    border-radius:15px;

    color:#555;

}



.delete{

    background:#FFB3BA;

    padding:5px 10px;

}


</style>


</head>



<body>



<div class="container">



<div class="calendarBox">


<img src="pingu.png.jpg" class="pingu">


<div class="header">


<button onclick="prev()">◀</button>


<span id="date"></span>


<button onclick="next()">▶</button>


</div>



<div class="week">

<div>일</div>
<div>월</div>
<div>화</div>
<div>수</div>
<div>목</div>
<div>금</div>
<div>토</div>

</div>



<div id="calendar" class="calendar"></div>



</div>





<div class="memoBox">


<div class="memoTitle">

📝 메모

</div>



<input id="memoText" placeholder="메모 입력">



<select id="memoColor">


<option value="#A7C7E7">

🔵 파랑

</option>


<option value="#B7E4C7">

🟢 초록

</option>


<option value="#FFE5A5">

🟡 노랑

</option>


<option value="#FFB3BA">

🔴 빨강

</option>


</select>




<button class="save" onclick="addMemo()">

저장

</button>



<div id="memoList"></div>



</div>


</div><script>

let year = 2026;

let month = 7;

let selectedDay = null;



let memos = JSON.parse(

localStorage.getItem("pinguMemos")

) || {};





// 메모 추가

function addMemo(){


if(selectedDay == null){

alert("날짜를 먼저 선택하세요");

return;

}



let text = memoText.value;



if(text.trim()==""){

return;

}




let key =

year+"-"+month+"-"+selectedDay;




if(!memos[key]){

memos[key]=[];

}




memos[key].push({

text:text,

color:memoColor.value

});





localStorage.setItem(

"pinguMemos",

JSON.stringify(memos)

);



memoText.value="";



showMemo();



draw();


}





// 메모 표시

function showMemo(){


memoList.innerHTML="";



if(selectedDay==null){

memoList.innerHTML="날짜를 선택하세요";

return;

}




let key =

year+"-"+month+"-"+selectedDay;



if(!memos[key]){

memoList.innerHTML="메모 없음";

return;

}





memos[key].forEach(function(memo,index){



let item=document.createElement("div");


item.className="memoItem";


item.style.background=memo.color;



item.innerHTML=

`

📝 ${memo.text}

<br><br>

<button class="delete"

onclick="deleteMemo(${index})">

🗑 삭제

</button>

`;



memoList.appendChild(item);



});



}





// 삭제

function deleteMemo(index){


let key =

year+"-"+month+"-"+selectedDay;



memos[key].splice(index,1);



if(memos[key].length===0){

delete memos[key];

}



localStorage.setItem(

"pinguMemos",

JSON.stringify(memos)

);



showMemo();


draw();


}
// 달력 만들기

function draw(){


calendar.innerHTML="";


date.innerHTML =

year+"년 "+(month+1)+"월";



let firstDay =

new Date(year,month,1).getDay();



let lastDate =

new Date(year,month+1,0).getDate();




// 앞쪽 빈칸

for(let i=0;i<firstDay;i++){

calendar.innerHTML += "<div></div>";

}




// 날짜 생성

for(let i=1;i<=lastDate;i++){



let day=document.createElement("div");



day.className="day";



day.innerHTML=i;




let key =

year+"-"+month+"-"+i;



// 메모 있는 날짜 표시

if(memos[key]){

day.style.background="#E8F7FF";

}




// 오늘 표시

let today=new Date();



if(

year==today.getFullYear()

&&

month==today.getMonth()

&&

i==today.getDate()

){

day.classList.add("today");

}




// 날짜 클릭

day.onclick=function(){



selectedDay=i;



document.querySelectorAll(".day")

.forEach(function(x){

x.classList.remove("selected");

});



day.classList.add("selected");



showMemo();


};



calendar.appendChild(day);



}



}





// 이전 달

function prev(){


month--;



if(month<0){

month=11;

year--;

}



draw();


}





// 다음 달

function next(){


month++;



if(month>11){

month=0;

year++;

}



draw();


}





// 처음 실행

draw();



</script>


</body>

</html>
